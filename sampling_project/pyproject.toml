[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "hydrax"
version = "0.0.2"
description = "Sampling-based model predictive control on GPU with JAX/MJX"
readme = "README.md"
requires-python = ">=3.12.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
]
dependencies = [
    "evosax>=0.1.6",
    "flax>=0.11.1",
    "huggingface_hub>=0.34.4",
    "interpax>=0.3.10",
    "jax[cuda12-local]>=0.7.1",
    "mujoco>=3.3.5",
    "mujoco-mjx>=3.3.5",
    "tqdm>=4.67.1",
    "imageio>=2.37.0",
    "numpy>=2.3.2",
    "pandas>=2.3.2",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.5",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "matplotlib>=3.10.5",
    "pre-commit>=4.0.1",
    "pytest>=8.3.3",
    "ruff>=0.7.1",
]
cpu = [
    "jax>=0.7.1",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = [
    "ANN",
    "N",
    "D",
    "B",
    "E",
    "F",
    "I",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
]
ignore = [
    "ANN003",
    "ANN202",
    "ANN204",
    "ANN401",
    "D100",
    "D104",
    "D203",
    "D211",
    "D212",
    "D213",
    "E731",
    "N806",
    "PLR0913",
    "PLR2004",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = [
    "hydrax",
]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.setuptools]
packages = [
    "hydrax",
]
